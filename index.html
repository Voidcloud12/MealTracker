<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Macro log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --bg:#EDF1F5;
  --surface:#FFFFFF;
  --raise:#F3F6F9;
  --ink:#172636;
  --ink-2:#435365;
  --ink-3:#5F6E7D;
  --line:#D6DEE6;
  --line-2:#B7C3CF;
  --board:#21508F;
  --board-ink:#FFFFFF;
  --board-soft:#DDE8F6;
  --over:#B8322A;
  --warn-bg:#F8E4E2;
  --good:#1D7446;
  --track:#DCE3EA;
  --hatch:rgba(184,50,42,.6);
  --m-b:#E0A526;
  --m-l:#D2672A;
  --m-s:#B04468;
  --m-d:#21508F;
  --m-x:#7A8896;
  --shadow:0 -10px 40px rgba(16,32,52,.18);
  --scrim:rgba(14,24,36,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171F; --surface:#18212C; --raise:#212C38; --ink:#E6ECF2; --ink-2:#B4C0CC; --ink-3:#8795A3;
    --line:#2A3644; --line-2:#3C4A5A; --board:#6E9FE4; --board-ink:#0C1520; --board-soft:#1F3149;
    --over:#FF7A6C; --warn-bg:#3B2426; --good:#63CF92; --track:#27323F; --hatch:rgba(255,122,108,.65);
    --m-b:#EDB83F; --m-l:#EC8448; --m-s:#DA6C93; --m-d:#6E9FE4; --m-x:#96A4B2;
    --shadow:0 -10px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#10171F; --surface:#18212C; --raise:#212C38; --ink:#E6ECF2; --ink-2:#B4C0CC; --ink-3:#8795A3;
  --line:#2A3644; --line-2:#3C4A5A; --board:#6E9FE4; --board-ink:#0C1520; --board-soft:#1F3149;
  --over:#FF7A6C; --warn-bg:#3B2426; --good:#63CF92; --track:#27323F; --hatch:rgba(255,122,108,.65);
  --m-b:#EDB83F; --m-l:#EC8448; --m-s:#DA6C93; --m-d:#6E9FE4; --m-x:#96A4B2;
  --shadow:0 -10px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2.5px solid var(--board);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none !important}

.wrap{max-width:560px;margin:0 auto;padding:max(10px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;padding:4px 0 12px}
.datebar{display:flex;align-items:center;gap:2px;min-width:0}
.nav-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.nav-btn svg{width:22px;height:22px}
.date-btn{display:flex;flex-direction:column;align-items:flex-start;padding:3px 8px;border-radius:12px;min-width:0}
.date-main{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.date-sub{font-size:13px;color:var(--ink-3)}
.pill{margin-left:4px;padding:6px 12px;border-radius:999px;background:var(--board-soft);color:var(--board);font-size:14px;font-weight:600}
.tools{display:flex;gap:2px;margin-left:auto}
.tool{padding:8px 10px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink-2)}
@media (hover:hover){
  .nav-btn:hover,.tool:hover,.date-btn:hover,.sh-btn:hover,.entry:hover{background:var(--raise)}
  .food:hover .food-plus{background:var(--board);color:var(--board-ink)}
}

.notice{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--raise);color:var(--ink-2);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.notice.warn{background:var(--warn-bg);color:var(--ink)}
.notice button{font-weight:700;color:var(--board);padding:4px 6px;flex:none}

/* Day summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;margin:0 0 6px}
.summary.loading{min-height:196px;display:grid;place-items:center;color:var(--ink-3)}
.metric+.metric{margin-top:18px}
.m-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.m-name{margin:0;font-size:15px;font-weight:600;color:var(--ink-2)}
.m-left{margin:0;font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.m-left.over{color:var(--over)}
.m-left.done{color:var(--good)}
.m-val{margin:0;line-height:1.1}
.m-big{font-size:34px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.m-of{font-size:15px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{position:relative;margin-top:10px;height:16px}
.bar-fill{display:flex;gap:2px;height:100%;border-radius:8px;overflow:hidden;background:var(--track)}
.seg{height:100%;flex:none}
.seg-b{background:var(--m-b)} .seg-l{background:var(--m-l)} .seg-s{background:var(--m-s)} .seg-d{background:var(--m-d)} .seg-x{background:var(--m-x)}
.hatch{position:absolute;top:0;height:100%;background:repeating-linear-gradient(-45deg,var(--hatch) 0 3px,transparent 3px 7px);border-radius:0 8px 8px 0;pointer-events:none}
.tick{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;margin:12px 0 0;padding:0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.minor{display:flex;flex-wrap:wrap;gap:4px 22px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3)}
.minor p{margin:0}
.minor b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* Meals */
.meal{padding:16px 0 18px;border-bottom:1px solid var(--line)}
.meal:last-of-type{border-bottom:0}
.meal-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.meal-head h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.meal-head h2::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--mc);flex:none}
.meal-tot{margin:0;text-align:right;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.3}
.meal-tot b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.entries{list-style:none;margin:6px -10px 0;padding:0}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;width:100%;padding:8px 10px;border-radius:12px;text-align:left}
.e-name{grid-column:1;grid-row:1;font-weight:500;overflow-wrap:anywhere}
.e-kcal{grid-column:2;grid-row:1;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.e-qty{grid-column:1;grid-row:2;font-size:13px;color:var(--ink-3)}
.e-p{grid-column:2;grid-row:2;text-align:right;font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.meal-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.btn-add{padding:9px 16px 9px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-add svg{width:18px;height:18px;color:var(--board)}
.chip-preset{padding:9px 14px;border-radius:999px;background:var(--board-soft);color:var(--board);font-size:15px;font-weight:600}
.link-btn{padding:8px 4px;font-size:14px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.foot-note{margin:18px 0 0;font-size:13px;color:var(--ink-3)}

/* Sheets */
#sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);outline:none}
.sheet.enter{animation:sheet-in .24s cubic-bezier(.2,.8,.25,1)}
@keyframes sheet-in{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{bottom:24px;border-radius:22px;max-height:calc(100% - 48px)}}
.sh-head{display:flex;align-items:center;gap:4px;padding:14px 10px 8px 18px}
.sh-head h2{margin:0;flex:1;min-width:0;font-size:20px;font-weight:650;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.sh-sub{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.sh-btn{padding:8px 10px;border-radius:10px;font-size:15px;font-weight:600;color:var(--board);flex:none}
.sh-back{display:grid;place-items:center;width:40px;height:40px;padding:0;margin-left:-10px;color:var(--ink-2)}
.sh-back svg{width:22px;height:22px}
.sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 18px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;flex-wrap:wrap;gap:10px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.search{padding:2px 18px 8px}
.input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);font-size:16px}
input.input{-webkit-appearance:none;appearance:none}
.input:focus{outline:none;border-color:var(--board);background:var(--surface)}
.input::placeholder{color:var(--ink-3)}
.input.ro{color:var(--ink-3)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;background:var(--raise);color:var(--ink-2);font-size:14px;font-weight:500;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.subtabs{display:flex;gap:4px;margin:4px 0 4px;padding:3px;border-radius:12px;background:var(--raise)}
.subtab{flex:1;padding:7px 2px;border-radius:9px;font-size:14px;color:var(--ink-2);text-align:center}
.subtab[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list-note{margin:10px 0 0;font-size:13px;color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.food-name{grid-column:1;font-weight:500;overflow-wrap:anywhere}
.food-meta{grid-column:1;font-size:13px;color:var(--ink-3)}
.food-plus{grid-column:2;grid-row:1 / span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--board-soft);color:var(--board)}
.food-plus svg{width:18px;height:18px}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--board-soft);color:var(--board);font-size:12px;font-weight:600;vertical-align:1px}
.empty{margin:0;padding:20px 0;color:var(--ink-3);font-size:15px}
.empty p{margin:0 0 12px}
.list-end{margin:16px 0 4px;font-size:14px;color:var(--ink-3)}
.inline-link{color:var(--board);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.fl{display:block;margin:16px 0 0;font-size:14px;font-weight:600;color:var(--ink-2)}
.fl > .input{margin-top:6px;font-weight:400}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;line-height:1.2;text-align:left}
.opt small{display:block;font-size:12px;color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--board);background:var(--board-soft);color:var(--board)}
.opt[aria-pressed="true"] small{color:var(--board)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:6px}
.step{width:50px;height:50px;border-radius:14px;background:var(--raise);display:grid;place-items:center;flex:none;color:var(--ink)}
.step svg{width:22px;height:22px}
.amt{width:104px;text-align:center;font-size:26px;font-weight:700;padding:6px 8px;font-variant-numeric:tabular-nums}
.amt-unit{font-size:16px;color:var(--ink-2);font-weight:500;min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;background:var(--raise);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.preview{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;margin:18px 0 0;padding:12px 14px;border-radius:16px;background:var(--raise)}
.pv b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
.pv span{font-size:12px;color:var(--ink-3)}
.pv-total{grid-column:1 / -1;margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.hint{margin:10px 0 0;font-size:13px;color:var(--ink-3)}
.btn-primary{flex:1 1 150px;padding:14px 16px;border-radius:14px;background:var(--board);color:var(--board-ink);font-size:16px;font-weight:650;text-align:center}
.btn-ghost{padding:12px 16px;border-radius:14px;border:1.5px solid var(--line-2);font-size:15px;font-weight:600;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn-ghost.small{padding:8px 12px;font-size:14px;margin-top:10px}
.btn-danger{padding:12px 16px;border-radius:14px;color:var(--over);font-size:15px;font-weight:600;border:1.5px solid var(--line)}
.btn-danger.confirm{background:var(--over);color:var(--surface);border-color:var(--over)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.file-btn:focus-within{outline:2.5px solid var(--board);outline-offset:2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (min-width:480px){.grid4{grid-template-columns:repeat(4,1fr)}}
.sec{margin:24px 0 0;font-size:16px;font-weight:650;color:var(--ink)}
.sec:first-child{margin-top:8px}
.help{margin:6px 0 0;font-size:13px;color:var(--ink-3);font-weight:400}
.help.strong{color:var(--ink);font-weight:600}
.unit-row{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;margin-top:8px}
.unit-row .input{padding:9px 10px;margin:0}
.x-btn{padding:8px 4px;color:var(--ink-3);font-size:14px;font-weight:500}
.err{margin:14px 0 0;color:var(--over);font-size:14px;font-weight:600}
.check{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--ink)}
.check input{width:20px;height:20px;margin:0;accent-color:var(--board)}
.pr-group{border:0;margin:0;padding:14px 0 16px;border-bottom:1px solid var(--line);min-width:0}
.pr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr-amt{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:15px}
.pr-amt .input{width:84px;text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums}
.day-row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.dr-date{grid-column:1;grid-row:1;font-weight:600}
.dr-k{grid-column:2;grid-row:1;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.dr-sub{grid-column:1;grid-row:2;font-size:13px;color:var(--ink-3)}
.dr-p{grid-column:2;grid-row:2;text-align:right;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dr-bar{grid-column:1 / -1;grid-row:3;height:5px;border-radius:3px;background:var(--track);margin-top:8px;overflow:hidden}
.dr-bar i{display:block;height:100%;background:var(--board);border-radius:3px}
.dr-bar i.over{background:var(--over)}
.avg{margin:16px 0 4px;padding:12px 14px;border-radius:14px;background:var(--raise);font-size:14px;color:var(--ink-2)}
.avg b{color:var(--ink);font-variant-numeric:tabular-nums}
.backup-text{min-height:120px;margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:11px 12px 11px 16px;border-radius:14px;background:var(--ink);color:var(--surface);font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
body.locked #toast{bottom:calc(86px + env(safe-area-inset-bottom))}
#toast button{color:var(--surface);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px 4px;flex:none}
#toast.show{animation:toast-in .18s ease-out}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.sheet.enter,#toast.show{animation:none}}
.sh-head,.search,.tabs,.sh-foot{flex:none}

</style>
</head>
<body>
<h1 class="sr-only">Macro log</h1>
<main id="app"></main>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* Food library. Values are per 100 g (or per 100 ml for drinks).
   Row: [id, name, kcal, protein, carbs, fat, units, flags, search aliases]
   units: "name:grams" list; "ladle:L" uses the ladle size from Settings.
   flags: e = estimate (no label), m = measured in ml. */

const MEALS = [
  { id: 'b', name: 'Breakfast' },
  { id: 'l', name: 'Lunch' },
  { id: 's', name: 'Snacks' },
  { id: 'd', name: 'Dinner' },
  { id: 'x', name: 'Extras' }
];
const MESS_MEALS = ['b', 'l', 's', 'd'];

const CATS = [
  { id: 'mess', name: 'Mess' },
  { id: 'basics', name: 'Basics' },
  { id: 'chips', name: 'Chips & namkeen' },
  { id: 'biscuits', name: 'Biscuits' },
  { id: 'choc', name: 'Chocolates & sweets' },
  { id: 'icecream', name: 'Ice creams' },
  { id: 'packaged', name: 'Noodles & bars' },
  { id: 'drinks', name: 'Drinks' },
  { id: 'cafe', name: 'Café & shakes' },
  { id: 'outside', name: 'Eating out' }
];

const BUILTIN = [];

function parseUnits(s) {
  if (!s) return [];
  return s.split(',').map(x => {
    const i = x.lastIndexOf(':');
    const n = x.slice(0, i).trim();
    const v = x.slice(i + 1).trim();
    return v === 'L' ? { n, L: 1 } : { n, q: parseFloat(v) };
  });
}

function D(cat, rows) {
  for (const r of rows) {
    const [id, name, k, p, c, f, units, flags = '', alias = ''] = r;
    BUILTIN.push({
      id, name, cat, k, p, c, f,
      b: flags.includes('m') ? 'ml' : 'g',
      units: parseUnits(units),
      est: flags.includes('e'),
      alias
    });
  }
}

D('mess', [

  w.pending = clone(data);
  if (!w.busy) flushWrites(path);
}
async function flushWrites(path) {
  const w = writers[path];
  w.busy = true;
  while (w.pending) {
    const data = w.pending;
    w.pending = null;
    let err = null;
    try {
      await backend.set(path, data);
    } catch (e) {
      err = e;
      const code = e && e.code;
      if (!code || code === 'unavailable' || code === 'resource_exhausted') {
        await sleep(800 + Math.random() * 1000);
        try { await backend.set(path, data); err = null; } catch (e2) { err = e2; }
      }
    }
    if (err) {
      if (!w.pending) { S.saveError = { path, data, msg: saveErrMsg(err) }; render(); }
    } else if (S.saveError && S.saveError.path === path) {
      S.saveError = null;
      render();
    }
  }
  w.busy = false;
}
function saveErrMsg(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') return 'Storage is full, so your last change wasn’t saved. Delete foods you no longer use, then retry.';
  if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') return 'This page lost access to your saved log, so your last change wasn’t saved. Reload the page, then retry.';
  if (code === 'invalid_argument') return 'Your last change couldn’t be saved.';
  return 'Your last change wasn’t saved. Check your connection, then retry.';
}
const dayDoc = () => ({ date: S.date, meals: S.day.meals, updated: Date.now() });
const saveDay = () => queueWrite('days/' + S.date, dayDoc());
const saveSettings = () => queueWrite('app/settings', S.settings);
const saveLib = () => queueWrite('app/library', S.lib);
function retrySave() {
  const e = S.saveError;
  if (!e) return;
  S.saveError = null;
  let data = e.data;
  if (e.path === 'days/' + S.date) data = dayDoc();
  else if (e.path === 'app/settings') data = S.settings;
  else if (e.path === 'app/library') data = S.lib;
  render();
  queueWrite(e.path, data);
}

let fatalCloud = false;
const resubscribed = {};
function applySettings(data) { S.settings = normSettings(data); if (S.ready) render(); }
function applyLib(data) { S.lib = normLib(data); if (S.ready) render(); }
function watchDoc(path, apply) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
    const timer = setTimeout(finish, 8000);
    backend.watch(path, data => {
      if (!isDirty(path)) apply(data);
      finish();
    }, e => {
      const code = e && e.code;
      if (!S.ready && ['not_granted', 'capability_disabled', 'capability_removed'].includes(code)) fatalCloud = true;
      else onSubError(path, e);
      finish();
    });
  });
}

let dayUnsub = null;
function watchDay(key, silent) {
  if (dayUnsub) { try { dayUnsub(); } catch (e) { /* ignore */ } dayUnsub = null; }
  if (!silent) { S.day = emptyDay(key); S.dayLoading = true; render(); }
  const path = 'days/' + key;
  dayUnsub = backend.watch(path, data => {
    if (S.date !== key) return;
    if (!S.dayLoading && isDirty(path)) return;
    S.day = normDay(data, key);
    S.dayLoading = false;
    render();
    if (sheet && sheet.type === 'add' && !sheet.pick) refreshAddSub();
  }, e => {
    if (S.date !== key) return;
    S.dayLoading = false;
    render();
    onSubError(path, e);
  });
}
function onSubError(path, e) {
  const code = e && e.code;
  if (code === 'unavailable' && !resubscribed[path]) {
    resubscribed[path] = true;
    setTimeout(() => {
      if (path === 'days/' + S.date) watchDay(S.date, true);
      else if (path === 'app/settings') watchDoc(path, applySettings);
      else if (path === 'app/library') watchDoc(path, applyLib);
    }, 2500);
    return;
  }
  S.syncError = code === 'revoked'
    ? 'This page lost access to your saved log. Reload the page to reconnect.'
    : 'Live updates stopped. Reload the page to see changes made on another device.';
  render();
}

/* ---------- Foods ---------- */
const BUILTIN_MAP = new Map(BUILTIN.map(f => [f.id, f]));
const CAT_ORDER = new Map(CATS.map((c, i) => [c.id, i]));
const catName = id => (CATS.find(c => c.id === id) || { name: 'My foods' }).name;
const mealName = id => (MEALS.find(m => m.id === id) || { name: '' }).name;
const isBaseUnit = u => !!u && (u.n === 'g' || u.n === 'ml');
const byName = (a, b) => a.name.localeCompare(b.name);
const byCatName = (a, b) => ((CAT_ORDER.has(a.cat) ? CAT_ORDER.get(a.cat) : 99) - (CAT_ORDER.has(b.cat) ? CAT_ORDER.get(b.cat) : 99)) || byName(a, b);

function normCustom(id, raw) {
  if (!raw || typeof raw !== 'object') return null;
  const b = ['g', 'ml', 'srv'].includes(raw.b) ? raw.b : 'g';
  const units = Array.isArray(raw.units) ? raw.units.filter(u => u && u.n && (u.L || +u.q > 0)) : [];
  if (b === 'srv' && !units.length) units.push({ n: 'serving', q: 1 });
  return { id, name: String(raw.name || 'Untitled food'), cat: raw.cat || 'custom', b, k: +raw.k || 0, p: +raw.p || 0, c: +raw.c || 0, f: +raw.f || 0, units, est: false, alias: '', custom: true };
}
function getFood(id) {
  if (!id) return null;
  if (Object.prototype.hasOwnProperty.call(S.lib.custom, id)) return normCustom(id, S.lib.custom[id]);
  const base = BUILTIN_MAP.get(id);
  if (!base || S.lib.hidden[id]) return null;
  const e = S.lib.edits[id];
  if (!e) return base;
  const pick = (v, fb) => (num(v) >= 0 ? +v : fb);
  return {
    ...base,
    name: e.name || base.name,
    k: pick(e.k, base.k), p: pick(e.p, base.p), c: pick(e.c, base.c), f: pick(e.f, base.f),
    units: Array.isArray(e.units) ? e.units : base.units,
    edited: true
  };
}
function allFoods() {
  const out = [];
  for (const f of BUILTIN) { const x = getFood(f.id); if (x) out.push(x); }
  for (const id of Object.keys(S.lib.custom)) { const x = getFood(id); if (x) out.push(x); }
  return out;
}
const customFoods = () => Object.keys(S.lib.custom).map(getFood).filter(Boolean).sort(byName);
function unitsOf(f) {
  const list = (f.units || []).map(u => ({ n: u.n, q: u.L ? S.settings.ladle : +u.q, L: !!u.L })).filter(u => u.q > 0);
  if (f.b !== 'srv') list.push({ n: f.b, q: 1 });
  if (!list.length) list.push({ n: 'serving', q: 1 });
  return list;
}
const defaultAmt = u => (isBaseUnit(u) ? 100 : 1);
function calc(src, amt, q) {
  const fac = (Number.isFinite(amt) ? amt : 0) * q / (src.b === 'srv' ? 1 : 100);
  return { k: src.k * fac, p: src.p * fac, c: src.c * fac, f: src.f * fac };
}
function unitText(amt, u, b) {
  const a = fmtAmt(amt);
  if (isBaseUnit(u)) return `${a} ${u.n}`;
  if (b === 'srv') return `${a} ${plural(u.n, amt)}`;
  return `${a} ${plural(u.n, amt)} (${fmtAmt(amt * u.q)} ${b})`;
}

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['’`.]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function searchFoods(q) {
  const nq = norm(q);
  if (!nq) return [];
  const terms = nq.split(' ');
  const out = [];
  for (const f of allFoods()) {
    const nn = norm(f.name);
    const words = (nn + ' ' + norm(f.alias) + ' ' + norm(catName(f.cat))).split(' ');
    if (!terms.every(t => words.some(w => w.startsWith(t)))) continue;
    let score = 0;
    if (nn === nq) score -= 100;
    if (nn.startsWith(nq)) score -= 40; else if (nn.includes(nq)) score -= 20;
    const nameWords = nn.split(' ');
    if (terms.every(t => nameWords.some(w => w.startsWith(t)))) score -= 10;
    if (f.custom) score -= 3;
    out.push([score, f]);
  }
  out.sort((a, b) => a[0] - b[0] || byName(a[1], b[1]));
  return out.slice(0, 80).map(x => x[1]);
}

function isBiryaniDay(d) {
  if (d.getDay() !== 3) return false;
  const w = Math.ceil(d.getDate() / 7);
  return w === 2 || w === 4;
}
function menuFor(k, meal) {
  const d = dateOf(k);
  const day = MENU[d.getDay()] || {};
  const raw = (day[meal] || []).map(s => ({ s, special: false }));
  if (isBiryaniDay(d) && (meal === 'l' || meal === 'd')) raw.unshift(...MENU_SPECIAL.map(s => ({ s, special: true })));
  const out = [];
  for (const { s, special } of raw) {
    const [id, label] = s.split('|');
    const f = getFood(id);
    if (f) out.push({ f, label: label || f.name, special });
  }
  return out;
}

/* ---------- Entries ---------- */
function makeEntry(f, label, amt, u) {
  return { id: uid(), fid: f.id, name: label || f.name, amt: r4(amt), u: u.n, q: r4(u.q), b: f.b, n: { k: f.k, p: f.p, c: f.c, f: f.f }, est: !!f.est, t: Date.now() };
}
const entrySrc = e => ({ k: +e.n.k || 0, p: +e.n.p || 0, c: +e.n.c || 0, f: +e.n.f || 0, b: e.b, est: !!e.est });
const entryMac = e => calc(entrySrc(e), +e.amt, +e.q);
function dayTotals(day) {
  const t = { k: 0, p: 0, c: 0, f: 0, meals: {} };
  for (const m of MEALS) {
    const mt = { k: 0, p: 0, c: 0, f: 0 };
    for (const e of day.meals[m.id] || []) {
      const x = entryMac(e);
      mt.k += x.k; mt.p += x.p; mt.c += x.c; mt.f += x.f;
    }
    t.meals[m.id] = mt;
    t.k += mt.k; t.p += mt.p; t.c += mt.c; t.f += mt.f;
  }
  return t;
}
const hasEntries = d => MEALS.some(m => (d.meals[m.id] || []).length > 0);
function pushRecent(id, label) {
  const r = S.settings.recent.filter(x => !(x.id === id && x.label === label));
  r.unshift({ id, label });
  S.settings.recent = r.slice(0, 24);
}
function removeEntries(k, meal, ids) {
  if (k !== S.date) return;
  S.day.meals[meal] = (S.day.meals[meal] || []).filter(e => !ids.includes(e.id));
  saveDay();
  render();
  if (sheet && sheet.type === 'add' && !sheet.pick) refreshAddSub();
}
function addEntries(meal, entries) {
  S.day.meals[meal].push(...entries);
  saveDay();
  render();
}

/* ---------- Presets ---------- */
const RE_OATS = /oats/i;
const RE_WHEY = /whey|protein powder/i;
const RE_MILK = /\bmilk\b/i;
const milkOk = f => f.cat === 'basics' || f.custom;
const foodsMatching = (re, extra) => allFoods().filter(f => f.b !== 'srv' && f.cat !== 'mess' && re.test(f.name) && (!extra || extra(f)));
function dinnerItems(p) {
  const out = [];
  const add = (use, key, amtKey) => {
    if (!p[use]) return;
    const f = getFood(p[key]);
    const a = num(p[amtKey]);
    if (!f || f.b === 'srv' || !(a > 0)) return;
    out.push({ f, amt: a, u: { n: f.b, q: 1 } });
  };
  add('useOats', 'oats', 'oatsG');
  add('useWhey', 'whey', 'wheyG');
  add('useMilk', 'milk', 'milkMl');
  return out;
}
function presetBrand() {
  const p = S.settings.preset;
  const f = p.useOats ? getFood(p.oats) : null;
  return f ? f.name.split(/[\s,]+/)[0] : '';
}
function savePreset(p) {
  const next = { ...S.settings.preset };
  for (const k of ['oats', 'whey', 'milk']) if (p[k]) next[k] = p[k];
  for (const k of ['oatsG', 'wheyG', 'milkMl']) { const v = num(p[k]); if (v > 0) next[k] = r2(v); }
  for (const k of ['useOats', 'useWhey', 'useMilk']) next[k] = !!p[k];
  S.settings.preset = next;
  saveSettings();
}
function addDinner(items) {
  const k = S.date;
  const es = items.map(it => makeEntry(it.f, it.f.name, it.amt, it.u));
  addEntries('d', es);
  const kcal = es.reduce((a, e) => a + entryMac(e).k, 0);
  toast(`Added usual dinner, ${fmtK(kcal)} kcal`, () => removeEntries(k, 'd', es.map(e => e.id)));
}
function quickDinner() {
  const items = dinnerItems(S.settings.preset);
  if (!items.length) { openPreset(); return; }
  addDinner(items);
}
function quickEggs() {
  const f = getFood('egg_boiled');
  if (!f) { toast('Boiled egg was deleted. Bring it back from Foods.'); return; }
  const units = unitsOf(f);
  const u = units.find(x => !isBaseUnit(x)) || units[0];
  const n = S.settings.eggs;
  const e = makeEntry(f, f.name, isBaseUnit(u) ? n * 45 : n, u);
  const k = S.date;
  addEntries('s', [e]);
  toast(`Added ${n} ${n === 1 ? 'egg' : 'eggs'}, ${fmtK(entryMac(e).k)} kcal`, () => removeEntries(k, 's', [e.id]));
}

/* ---------- Main view ---------- */
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  const t = dayTotals(S.day);
  app.innerHTML = `<div class="wrap">${headerHTML()}${noticeHTML()}${summaryHTML(t)}${MEALS.map(m => mealHTML(m, t.meals[m.id])).join('')}<p class="foot-note">≈ marks estimates, like mess food and café drinks. Tap anything you logged to change or remove it.</p></div>`;
}

function headerHTML() {
  const k = S.date;
  const rel = relLabel(k);
  let sub;
  if (rel) sub = dateText(k);
  else { const diff = daysBetween(todayKey(), k); sub = diff < 0 ? `${-diff} days ago` : `In ${diff} days`; }
  return `<header class="top">
    <div class="datebar">
      <button class="nav-btn" data-act="prev-day" aria-label="Previous day">${ICON.left}</button>
      <button class="date-btn" data-act="open-history" aria-label="${esc((rel || dateText(k)) + ', choose another day')}">
        <span class="date-main">${esc(rel || dateText(k))}</span><span class="date-sub">${esc(sub)}</span>
      </button>
      <button class="nav-btn" data-act="next-day" aria-label="Next day">${ICON.right}</button>
      ${k === todayKey() ? '' : '<button class="pill" data-act="today">Today</button>'}
    </div>

}

function noticeHTML() {
  let h = '';
  if (S.saveError) h += `<div class="notice warn" role="alert"><span>${esc(S.saveError.msg)}</span><button data-act="retry-save">Retry</button></div>`;
  if (S.syncError) h += `<p class="notice warn" role="alert">${esc(S.syncError)}</p>`;
  if (S.mode === 'local' && S.ready) {
    h += `<p class="notice">${LS.ok ? 'This page isn’t connected to your Claude account here, so your log is saved in this browser only.' : 'This page can’t save anything here, so your log will be lost when you close it.'}</p>`;
  }
  return h;
}

function metricHTML(o) {
  const { name, key, t, target, big, of, left, cls, hatch } = o;
  const total = t[key];
  const max = Math.max(target * 1.15, total * 1.04, 1);
  const segs = MEALS.map(m => {
    const v = t.meals[m.id][key];
    return v > 0 ? `<span class="seg seg-${m.id}" style="width:${(v / max * 100).toFixed(3)}%"></span>` : '';
  }).join('');
  const tickPos = target / max * 100;
  const over = hatch && total > target ? `<span class="hatch" style="left:${tickPos.toFixed(3)}%;width:${((total - target) / max * 100).toFixed(3)}%"></span>` : '';
  const label = `${name}: ${big} ${of}. ` + MEALS.filter(m => t.meals[m.id][key] > 0).map(m => `${m.name} ${key === 'k' ? fmtK(t.meals[m.id].k) + ' kcal' : fmtG(t.meals[m.id].p) + ' g'}`).join(', ');
  return `<div class="metric">
    <div class="m-top"><h2 class="m-name">${name}</h2><p class="m-left ${cls}">${esc(left)}</p></div>
    <p class="m-val"><span class="m-big">${big}</span> <span class="m-of">${esc(of)}</span></p>
    <div class="bar" role="img" aria-label="${esc(label)}"><div class="bar-fill">${segs}</div>${over}${target > 0 ? `<span class="tick" style="left:${tickPos.toFixed(3)}%"></span>` : ''}</div>
  </div>`;
}

function summaryHTML(t) {
  if (!S.ready || S.dayLoading) return '<section class="summary loading" aria-busy="true"><p>Loading your log…</p></section>';
  const st = S.settings;
  const kLeft = st.kcal - t.k;
  const pLeft = st.protein - t.p;
  const legend = MEALS.filter(m => t.meals[m.id].k > 0.5).map(m => `<li><span class="sw seg-${m.id}"></span>${m.name} ${fmtK(t.meals[m.id].k)}</li>`).join('');
  return `<section class="summary" aria-label="Totals for the day">
    ${metricHTML({ name: 'Calories', key: 'k', t, target: st.kcal, big: fmtK(t.k), of: `of ${fmtK(st.kcal)} kcal`, left: kLeft >= 0 ? `${fmtK(kLeft)} kcal left` : `${fmtK(-kLeft)} kcal over`, cls: kLeft < 0 ? 'over' : '', hatch: true })}
    ${metricHTML({ name: 'Protein', key: 'p', t, target: st.protein, big: fmtG(t.p), of: `of ${fmtG(st.protein)} g`, left: pLeft > 0.05 ? `${fmtG(pLeft)} g to go` : 'Target reached', cls: pLeft > 0.05 ? '' : 'done', hatch: false })}
    ${legend ? `<ul class="legend" aria-hidden="true">${legend}</ul>` : ''}
    <div class="minor">
      <p>Carbs <b>${fmtG(t.c)}${st.carbs ? ` / ${fmtG(st.carbs)}` : ''} g</b></p>
      <p>Fat <b>${fmtG(t.f)}${st.fat ? ` / ${fmtG(st.fat)}` : ''} g</b></p>
    </div>
  </section>`;
}

function mealHTML(m, mt) {
  const entries = S.day.meals[m.id] || [];
  const dis = !S.ready || S.dayLoading ? 'disabled' : '';
  let presets = '';
  if (m.id === 's') presets = `<button class="chip-preset" data-act="preset-eggs" ${dis}>+ ${S.settings.eggs} ${S.settings.eggs === 1 ? 'egg' : 'eggs'}</button>`;
  if (m.id === 'd') {
    const brand = presetBrand();
    presets = `<button class="chip-preset" data-act="preset-dinner" ${dis}>+ Usual dinner${brand ? ` (${esc(brand)})` : ''}</button><button class="link-btn" data-act="preset-dinner-edit" ${dis}>Change</button>`;
  }
  return `<section class="meal" style="--mc:var(--m-${m.id})" aria-labelledby="h-${m.id}">
    <div class="meal-head"><h2 id="h-${m.id}">${m.name}</h2>${entries.length ? `<p class="meal-tot"><b>${fmtK(mt.k)} kcal</b>${fmtG(mt.p)} g protein</p>` : ''}</div>
    ${entries.length ? `<ul class="entries">${entries.map(e => entryHTML(m.id, e)).join('')}</ul>` : ''}

function entryHTML(meal, e) {
  const m = entryMac(e);
  return `<li><button class="entry" data-act="edit-entry" data-meal="${meal}" data-id="${esc(e.id)}">
    <span class="e-name">${esc(e.name)}</span>
    <span class="e-kcal">${e.est ? '≈ ' : ''}${fmtK(m.k)} kcal</span>
    <span class="e-qty">${esc(unitText(+e.amt, { n: e.u, q: +e.q }, e.b))}</span>

/* ---------- Sheets ---------- */
let sheet = null;
let focusReturn = null;

function setFocusReturn(sel, fallback) { if (!sheet) focusReturn = { sel, fallback }; }
function openSheet(s, animate) {
  const anim = animate === undefined ? (!sheet || sheet.type !== s.type) : animate;
  sheet = s;
  renderSheet(anim);
}
function closeSheet() {
  sheet = null;
  renderSheet(false);
  if (focusReturn) {
    const el = document.querySelector(focusReturn.sel) || (focusReturn.fallback && document.querySelector(focusReturn.fallback));
    if (el) el.focus({ preventScroll: true });
    focusReturn = null;
  }
}
function viewKey() {
  if (sheet.type === 'add') return sheet.pick ? 'add:pick' : `add:list:${sheet.tab}:${sheet.messMeal}`;
  if (sheet.type === 'library') return `library:${sheet.tab}`;
  return sheet.type;
}
const SHEETS = {};
function renderSheet(animate) {
  const root = document.getElementById('sheet');
  if (!sheet) {
    root.hidden = true;
    root.innerHTML = '';
    delete root.dataset.view;
    document.body.classList.remove('locked');
    return;
  }
  const oldKey = root.dataset.view;
  const oldBody = root.querySelector('.sh-body');
  const oldScroll = oldBody ? oldBody.scrollTop : 0;
  const active = document.activeElement;
  const activeId = active && root.contains(active) && active.id ? active.id : null;
  const html = SHEETS[sheet.type]();
  const key = viewKey();
  root.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet${animate ? ' enter' : ''}" role="dialog" aria-modal="true" aria-labelledby="sh-title" tabindex="-1">${html}</div>`;
  root.dataset.view = key;
  root.hidden = false;
  document.body.classList.add('locked');
  const body = root.querySelector('.sh-body');
  if (body) {
    if (key === oldKey && !animate) body.scrollTop = oldScroll;
    else if (sheet.type === 'add' && !sheet.pick && sheet.listScroll) { body.scrollTop = sheet.listScroll; sheet.listScroll = 0; }
  }
  if (animate) { const d = root.querySelector('.sheet'); if (d) d.focus({ preventScroll: true }); }
  else if (activeId) { const el = document.getElementById(activeId); if (el) el.focus({ preventScroll: true }); }
}

/* Add food */

function openEntry(meal, id) {
  const e = (S.day.meals[meal] || []).find(x => x.id === id);

  const f = getFood(e.fid);
  let units = f && f.b === e.b ? unitsOf(f) : [];

function formErr(msg) {

function saveFoodForm() {
  const s = sheet;
  const fm = s.form;
  const name = String(fm.name || '').trim();
  const k = num(fm.k);
  const p = numOr0(fm.p), c = numOr0(fm.c), fat = numOr0(fm.f);
  if (!name) return formErr('Add a name for this food.');
  if (!(k >= 0)) return formErr('Add the calories. Use 0 if it has none.');
  if (![p, c, fat].every(x => x >= 0)) return formErr('Protein, carbs and fat need to be numbers, or left empty.');
  let units = [];
  if (fm.basis !== 'srv') {
    for (const u of fm.units) {
      if (u.L) { units.push({ n: 'ladle', L: 1 }); continue; }
      const n = String(u.n || '').trim();
      const q = num(u.q);
      if (!n && String(u.q || '').trim() === '') continue;
      if (!n) return formErr('Give each size a name, like pack or piece.');
      if (/^(g|ml)$/i.test(n)) return formErr(`You can already log in ${fm.basis}, so remove the “${n}” size.`);
      if (!(q > 0)) return formErr(`Add the weight for “${n}”.`);
      units.push({ n, q: r2(q) });
    }
  }
  let id = s.id;
  if (s.builtin) {
    S.lib.edits[id] = { name, k: r2(k), p: r2(p), c: r2(c), f: r2(fat), units };
  } else {
    id = id || 'c_' + uid();
    let food;
    if (fm.basis === 'srv') {
      const sn = String(fm.srvName || '').trim() || 'serving';
      if (/^(g|ml)$/i.test(sn)) return formErr('Name the serving something like plate or bowl.');
      const g = num(fm.srvG);
      if (String(fm.srvG || '').trim() !== '' && !(g > 0)) return formErr('The weight needs to be a number, or left empty.');
      food = g > 0
        ? { name, cat: fm.cat, b: 'g', k: r2(k / g * 100), p: r2(p / g * 100), c: r2(c / g * 100), f: r2(fat / g * 100), units: [{ n: sn, q: r2(g) }] }
        : { name, cat: fm.cat, b: 'srv', k: r2(k), p: r2(p), c: r2(c), f: r2(fat), units: [{ n: sn, q: 1 }] };
    } else {
      food = { name, cat: fm.cat, b: fm.basis, k: r2(k), p: r2(p), c: r2(c), f: r2(fat), units };
    }
    S.lib.custom[id] = food;
  }
  saveLib();
  render();
  const back = s.returnTo;
  const saved = getFood(id);
  if (back && back.type === 'add' && saved) {
    if (!s.id || (back.pick && back.pick.id === id)) {
      back.query = '';
      back.pick = { id, label: s.id && back.pick ? back.pick.label : saved.name, unitIdx: 0, amt: defaultAmt(unitsOf(saved)[0]) };
    }
    openSheet(back, false);
  } else if (back) {
    openSheet(back, false);
  } else {
    closeSheet();

SHEETS.history = function () {

  else if (s.err) body = `<p class="err">${esc(s.err)}</p>`;

    const map = new Map(s.days.map(d => [d.date, d]));

    let avg = '';

      avg = `<p class="avg">Last 7 days: <b>${fmtK(sum.k / week.length)} kcal</b> and <b>${fmtG(sum.p / week.length)} g protein</b> a day on average, across ${week.length} logged ${week.length === 1 ? 'day' : 'days'}.</p>`;

function dayRowHTML(d) {

function applySetting(el) {

  const st = S.settings;
  if (key === 'carbs' || key === 'fat') st[key] = v > 0 ? Math.round(v) : null;
  else if (key === 'eggs') { if (v >= 1 && v <= 12) st.eggs = Math.round(v); }

async function downloadBackup() {
  const token = sheet;
  token.busy = 'Preparing your backup…';
  token.msg = '';
  renderSheet(false);
  try {
    const days = (await backend.listDays()).filter(d => d && validKey(d.date));
    const text = JSON.stringify({ app: 'macro-tracker', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, library: S.lib, days });
    const filename = `macro-tracker-backup-${todayKey()}.json`;
    const dl = await getDownloads();
    if (dl) {
      try { await dl.save({ filename, data: text }); token.msg = 'Backup saved.'; }
      catch (e) {
        const code = e && e.code;
        if (code === 'declined') token.msg = 'Backup not saved.';
        else if (code === 'rate_limited') token.msg = 'A save prompt is already open. Finish that one first.';
        else { token.backupText = text; token.msg = 'Downloading isn’t available here. Copy the text below and keep it somewhere safe.'; }
      }
    } else {
      token.backupText = text;
      token.msg = 'Downloading isn’t available here. Copy the text below and keep it somewhere safe.';
    }
  } catch (e) {
    token.msg = 'Your saved days couldn’t be read. Check your connection and try again.';
  }
  token.busy = '';
  if (sheet === token) renderSheet(false);
}
function readBackupFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const token = sheet;
  const reader = new FileReader();
  reader.onload = () => {
    if (sheet !== token) return;
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || data.app !== 'macro-tracker' || !Array.isArray(data.days)) throw new Error('not a backup');
      const nDays = data.days.filter(d => d && validKey(d.date)).length;
      const nFoods = Object.keys((data.library && data.library.custom) || {}).length;
      token.restore = data;
      token.backupText = '';
      token.msg = `This backup has ${nDays} logged ${nDays === 1 ? 'day' : 'days'} and ${nFoods} ${nFoods === 1 ? 'food' : 'foods'} you created. Restoring replaces your targets and foods, and overwrites any day that’s in the backup.`;
    } catch (e) {
      token.restore = null;
      token.msg = 'That file isn’t a backup from this tracker. Choose the .json file you downloaded from Settings.';
    }
    renderSheet(false);
  };
  reader.onerror = () => { if (sheet === token) { token.msg = 'That file couldn’t be read. Try again.'; renderSheet(false); } };
  reader.readAsText(file);
}
async function setWithRetry(path, data) {
  for (let i = 0; ; i++) {
    try { await backend.set(path, data); return; }
    catch (e) {
      const code = e && e.code;
      if (i < 3 && (!code || code === 'unavailable' || code === 'resource_exhausted')) { await sleep(1200 * (i + 1)); continue; }
      throw e;
    }
  }
}
async function restoreBackup() {
  const token = sheet;
  const data = token.restore;
  if (!data) return;
  token.restore = null;
  token.busy = 'Restoring…';
  token.msg = '';
  renderSheet(false);
  try {
    S.settings = normSettings(data.settings);
    S.lib = normLib(data.library);
    await setWithRetry('app/settings', clone(S.settings));
    await setWithRetry('app/library', clone(S.lib));
    for (const d of data.days) {
      if (!d || !validKey(d.date)) continue;
      const nd = normDay(d, d.date);
      await setWithRetry('days/' + nd.date, { date: nd.date, meals: nd.meals, updated: Date.now() });
      await sleep(40);
    }
    token.msg = 'Backup restored.';
    watchDay(S.date);
  } catch (e) {
    token.msg = 'The restore stopped partway. ' + saveErrMsg(e);
  }
  token.busy = '';
  render();
  if (sheet === token) renderSheet(false);
}

/* ---------- Toast ---------- */
let toastTimer = null;
let undoFn = null;
function toast(msg, undo) {
  const el = document.getElementById('toast');
  undoFn = undo || null;
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Undo</button>' : ''}`;
  el.hidden = false;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 5000 : 2400);
}
function hideToast() {
  const el = document.getElementById('toast');
  el.hidden = true;
  el.classList.remove('show');
  undoFn = null;
}

/* ---------- Navigation ---------- */
function setDate(k) {
  if (!validKey(k) || k === S.date) return;
  S.date = k;
  S.followToday = k === todayKey();
  if (S.ready) watchDay(k); else render();
}

/* ---------- Events ---------- */
const ACTIONS = {
  'prev-day': () => setDate(shiftKey(S.date, -1)),
  'next-day': () => setDate(shiftKey(S.date, 1)),
  'today': () => setDate(todayKey()),
  'open-history': () => openHistory(),

  'add': el => openAdd(el.dataset.meal),
  'edit-entry': el => openEntry(el.dataset.meal, el.dataset.id),
  'preset-eggs': () => quickEggs(),
  'preset-dinner': () => quickDinner(),
  'preset-dinner-edit': () => openPreset(),
  'retry-save': () => retrySave(),
  'close': () => closeSheet(),
  'undo': () => { const f = undoFn; hideToast(); if (f) f(); },

  'tab': el => { sheet.tab = el.dataset.id; sheet.listScroll = 0; renderSheet(false); },
  'mess-meal': el => { sheet.messMeal = el.dataset.id; renderSheet(false); },
  'pick-food': el => {
    const f = getFood(el.dataset.id);
    if (!f) return;
    const list = document.getElementById('food-list');
    sheet.listScroll = list ? list.scrollTop : 0;
    const u = unitsOf(f)[0];
    sheet.pick = { id: f.id, label: el.dataset.label || f.name, unitIdx: 0, amt: defaultAmt(u) };
    renderSheet(false);
  },
  'back': () => {
    if (sheet.type === 'add' && sheet.pick) { sheet.pick = null; renderSheet(false); return; }
    if (sheet.type === 'food' && sheet.returnTo) { openSheet(sheet.returnTo, false); return; }
    closeSheet();
  },
  'new-food': () => openFoodForm(null, sheet),
  'edit-food': el => openFoodForm(el.dataset.id, sheet),

  'qty-unit': el => {
    const c = qtyCtx();
    if (!c) return;
    const i = +el.dataset.i;
    const from = c.units[c.st.unitIdx];
    const to = c.units[i];
    if (!to || i === c.st.unitIdx) return;
    let amt = Number.isFinite(c.st.amt) && c.st.amt > 0 ? c.st.amt * from.q / to.q : NaN;
    amt = isBaseUnit(to) ? Math.round(amt) : Math.round(amt * 4) / 4;
    if (!(amt > 0)) amt = defaultAmt(to);
    c.st.unitIdx = i;
    c.st.amt = amt;
    renderSheet(false);
  },
  'qty-step': el => {
    const c = qtyCtx();
    if (!c) return;
    const u = c.units[c.st.unitIdx];
    const step = isBaseUnit(u) ? (c.src.b === 'ml' ? 10 : 5) : 0.5;
    const cur = Number.isFinite(c.st.amt) ? c.st.amt : 0;
    const next = Math.max(0, Math.round((cur + step * +el.dataset.d) / step) * step);
    c.st.amt = r4(next);
    updateQtyLive(c, true);
  },
  'qty-quick': el => { const c = qtyCtx(); if (!c) return; c.st.amt = +el.dataset.v; updateQtyLive(c, true); },
  'qty-confirm': () => {
    const c = qtyCtx();
    if (!c || !(c.st.amt > 0)) return;
    const u = c.units[c.st.unitIdx];
    if (sheet.type === 'add') {
      const s = sheet;
      const e = makeEntry(c.src, s.pick.label, c.st.amt, u);
      pushRecent(c.src.id, s.pick.label);
      addEntries(s.meal, [e]);
      saveSettings();
      const k = S.date;
      toast(`Added ${s.pick.label}`, () => removeEntries(k, s.meal, [e.id]));
      s.pick = null;
      renderSheet(false);
    } else {
      const s = sheet;
      const arr = S.day.meals[s.meal] || [];
      const e = arr.find(x => x.id === s.e.id);
      if (!e) { closeSheet(); return; }
      e.amt = r4(c.st.amt);
      e.u = u.n;
      e.q = r4(u.q);
      if (s.newMeal !== s.meal) {
        S.day.meals[s.meal] = arr.filter(x => x.id !== e.id);
        S.day.meals[s.newMeal].push(e);

      saveDay();
      render();
      closeSheet();

    }
  },

  'entry-delete': () => {

  'pr-pick': el => { sheet.p[el.dataset.k] = el.dataset.id; renderSheet(false); },
  'pr-milk': el => { sheet.p.milkMl = +el.dataset.v; sheet.p.useMilk = true; renderSheet(false); },

  'lib-tab': el => { sheet.tab = el.dataset.id; renderSheet(false); },
  'lib-open': el => openFoodForm(el.dataset.id, sheet),
  'lib-new': () => openFoodForm(null, sheet),
  'lib-restore': () => { S.lib.hidden = {}; saveLib(); render(); renderSheet(false); toast('Deleted foods are back'); },

  'go-date': el => { setDate(el.dataset.k); closeSheet(); },

  'backup-download': () => downloadBackup(),
  'restore-confirm': () => restoreBackup(),
  'restore-cancel': () => { sheet.restore = null; sheet.msg = ''; renderSheet(false); }
};
const ALWAYS_ALLOWED = new Set(['prev-day', 'next-day', 'today', 'close', 'undo']);

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const fn = ACTIONS[act];
  if (!fn) return;
  if (!S.ready && !ALWAYS_ALLOWED.has(act)) return;
  if (act !== 'close' && act !== 'undo' && act !== 'retry-save' && !sheet && !el.closest('#app') && !el.closest('#toast')) return;
  ev.preventDefault();
  fn(el, ev);
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (!sheet) return;
  if (el.id === 'q' && sheet.type === 'add') {
    sheet.query = el.value;
    const tabs = document.getElementById('add-tabs');
    if (tabs) tabs.hidden = !!el.value.trim();
    const list = document.getElementById('food-list');
    if (list) { list.innerHTML = addListHTML(); list.scrollTop = 0; }
    return;
  }
  if (el.id === 'lib-q' && sheet.type === 'library') {
    sheet.query = el.value;
    const tabs = document.getElementById('lib-tabs');
    if (tabs) tabs.hidden = !!el.value.trim();
    const list = document.getElementById('lib-list');
    if (list) { list.innerHTML = libListHTML(); list.scrollTop = 0; }
    return;
  }
  if (el.id === 'amt') {
    const c = qtyCtx();
    if (!c) return;
    const v = num(el.value);
    c.st.amt = v >= 0 ? v : NaN;
    updateQtyLive(c, false);
    return;
  }
  if (sheet.type === 'preset' && el.dataset.pr && el.type !== 'checkbox') {
    sheet.p[el.dataset.pr] = num(el.value);
    const pv = document.getElementById('pr-preview');
    if (pv) pv.innerHTML = presetPreview(sheet.p);
    return;
  }
  if (sheet.type === 'food' && el.dataset.ff) { sheet.form[el.dataset.ff] = el.value; return; }
  if (sheet.type === 'food' && el.dataset.fu) {
    const row = sheet.form.units[+el.dataset.i];
    if (row) row[el.dataset.fu] = el.value;
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (!sheet) return;
  if (sheet.type === 'preset' && el.dataset.pr && el.type === 'checkbox') {
    sheet.p[el.dataset.pr] = el.checked;
    const pv = document.getElementById('pr-preview');
    if (pv) pv.innerHTML = presetPreview(sheet.p);
    return;
  }
  if (sheet.type === 'food' && el.dataset.ff) {
    sheet.form[el.dataset.ff] = el.value;
    if (el.dataset.ff === 'srvName') { const l = document.getElementById('val-l'); if (l) l.textContent = `Values for 1 ${el.value.trim() || 'serving'}`; }
    return;
  }
  if (sheet.type === 'settings' && el.dataset.set) { applySetting(el); return; }
  if (sheet.type === 'settings' && el.dataset.backup === 'file') { readBackupFile(el); return; }
  if (sheet.type === 'history' && el.dataset.hist === 'date') {
    if (validKey(el.value)) { setDate(el.value); closeSheet(); }
    return;
  }
  if (el.id === 'amt') {
    const c = qtyCtx();
    if (c && Number.isFinite(c.st.amt)) el.value = fmtAmt(c.st.amt);
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sheet) {
    ev.preventDefault();
    if (sheet.type === 'add' && sheet.pick) { sheet.pick = null; renderSheet(false); }
    else if (sheet.type === 'food' && sheet.returnTo) openSheet(sheet.returnTo, false);
    else closeSheet();
    return;
  }
  if (ev.key === 'Enter' && sheet && ev.target && ev.target.id === 'amt') {
    ev.preventDefault();
    ACTIONS['qty-confirm']();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.ready && S.followToday && S.date !== todayKey() && !sheet) setDate(todayKey());
});
setInterval(() => {
  if (S.ready && S.followToday && S.date !== todayKey() && !sheet) setDate(todayKey());
}, 60000);

/* ---------- Start ---------- */
async function init() {
  render();
  let db = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db');
  } catch (e) { db = null; }
  if (db) { Cloud.db = db; backend = Cloud; S.mode = 'cloud'; }
  await Promise.all([watchDoc('app/settings', applySettings), watchDoc('app/library', applyLib)]);
  if (S.mode === 'cloud' && fatalCloud) {
    backend = Local;
    S.mode = 'local';
    await Promise.all([watchDoc('app/settings', applySettings), watchDoc('app/library', applyLib)]);
  }
  if (S.mode === 'loading') S.mode = 'local';
  S.ready = true;
  watchDay(S.date);
}

window.__macroTracker = { S, getFood, allFoods, menuFor, searchFoods, dayTotals };
init();
})();

</script>
